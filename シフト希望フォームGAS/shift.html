<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --bg:#F4F5F3; --surface:#FFFFFF; --surface-2:#F7F6F3;
    --text:#23211E; --text-muted:#726E67; --line:#DDD9D2;
    --accent:#E8501C; --accent-ink:#FFFFFF; --accent-tint:#FBE4D8;
    --bar:#B9B3AA; --bar-break:#E7E3DC;
    --sun-holiday:#C8333F; --sat:#2A6FB0;
    --go:#1E7D4F; --go-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(35,33,30,0.06), 0 4px 14px rgba(35,33,30,0.05);
    /* 次の出勤の大きい字。せまい画面では小さくして、1行に収める */
    --next-big:clamp(20px, 6.2vw, 30px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181715; --surface:#221F1C; --surface-2:#2A2723;
      --text:#F3F1EC; --text-muted:#A8A39A; --line:#3A362F;
      --accent:#FF7043; --accent-ink:#1A0E08; --accent-tint:#3A2418;
      --bar:#6B655C; --bar-break:#332F2A;
      --sun-holiday:#E5707A; --sat:#6FA3D8;
      --go:#4CBE84; --go-ink:#0C2016;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:18px 16px 40px; background:var(--bg); color:var(--text);
    font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    font-size:14px; -webkit-text-size-adjust:100%;
  }
  .wrap{ max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .num{ font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }

  header{ display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
  header h1{ margin:0; font-size:19px; font-weight:700; }
  header p{ margin:3px 0 0; font-size:12.5px; color:var(--text-muted); }
  .change{ font-size:12.5px; color:var(--accent); background:none; border:0; padding:4px; text-decoration:underline; }

  /* 名前を選ぶ画面 */
  .pick h1{ margin:0 0 4px; font-size:19px; }
  .pick p{ margin:0 0 12px; font-size:13px; color:var(--text-muted); }
  .names{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .names button{
    font-size:15px; color:var(--text); background:var(--surface); border:1px solid var(--line);
    border-radius:11px; padding:13px 8px; box-shadow:var(--shadow);
  }

  .mode{ display:grid; grid-template-columns:1fr 1fr; background:var(--surface-2); border:1px solid var(--line);
    border-radius:12px; padding:3px; gap:3px; }
  .mode button{ border:0; background:transparent; color:var(--text-muted); font-size:14px; padding:9px 4px; border-radius:9px; }
  .mode button[aria-pressed="true"]{ background:var(--surface); color:var(--text); font-weight:700; box-shadow:var(--shadow); }

  .tabs{ display:grid; gap:6px; }
  .tab{ font-size:12px; color:var(--text); background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:6px 2px; line-height:1.35; }
  .tab[aria-pressed="true"]{ background:var(--accent-tint); border-color:var(--accent); color:var(--accent); font-weight:700; }

  .next{ background:var(--accent); color:var(--accent-ink); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .next.soon{ background:var(--go); color:var(--go-ink); }   /* 今日でなければ緑 */
  .next .d{ font-size:var(--next-big); line-height:1.25; font-weight:700; }
  .next .d .dd{ margin-left:.4em; }
  .next .t{ font-size:var(--next-big); line-height:1.2; font-weight:700; }
  .next .b{ font-size:12.5px; opacity:.9; margin-left:.6em; white-space:nowrap; }

  .list{ background:var(--surface); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .row{ display:grid; grid-template-columns:82px 1fr; gap:10px; align-items:center; padding:11px 14px; border-top:1px solid var(--line); }
  .row:first-child{ border-top:0; }
  .day{ font-size:13.5px; }
  .day .num{ font-size:17px; font-weight:500; }
  .sun .day, .hol .day{ color:var(--sun-holiday); }
  .sat .day{ color:var(--sat); }
  .tm{ font-size:21px; font-weight:700; }
  .br{ font-size:12px; color:var(--text-muted); }
  .off .tm{ font-size:14px; font-weight:400; color:var(--text-muted); }
  .today{ background:var(--accent-tint); }
  .tag{ font-size:10.5px; font-weight:700; color:var(--accent); margin-left:4px; }
  .total{ display:flex; justify-content:space-between; align-items:baseline; padding:12px 14px;
    border-top:1px solid var(--line); background:var(--surface-2); font-size:13px; color:var(--text-muted); }
  .total b{ font-size:23px; color:var(--text); }

  .cal{ font-size:15px; font-weight:700; color:var(--accent); background:var(--surface);
    border:1.5px solid var(--accent); border-radius:12px; padding:12px; width:100%; }
  .calbox{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.7; }
  .calbox a{ color:var(--accent); font-weight:700; }
  .calbox h3{ margin:0 0 6px; font-size:13.5px; }
  .calbox .sep{ height:1px; background:var(--line); margin:10px 0; }
  .calbox .hint{ color:var(--text-muted); font-size:12px; }
  .calbox .lead{ background:var(--surface-2); border-radius:9px; padding:8px 10px; margin-bottom:8px; }
  .calbox .steps{ margin:6px 0 10px; padding-left:20px; }
  .calbox .steps li{ margin-bottom:3px; }
  /* 「.calbox a」より後ろで、かつ同じ強さ以上にしないと文字の色が負けて、
     オレンジの上にオレンジの文字＝見えないボタンになる（2026-09-28に実際に起きた） */
  .calbox a.calgo, .calgo{ display:block; text-align:center; background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:15px; padding:13px 12px; border-radius:11px; text-decoration:none; }
  /* どちらのカレンダーを使っているかを選ぶタブ。2つとも同じ形にして迷わないようにする */
  .calpick{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 12px; }
  .calpick-btn{
    font-family:inherit; font-size:13px; font-weight:600; color:var(--text); cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:9px 8px;
    display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.35;
  }
  .calpick-btn small{ font-size:10.5px; font-weight:500; color:var(--text-muted); }
  .calpick-btn[aria-pressed="true"]{ background:var(--accent-tint); border-color:var(--accent); color:var(--accent); }
  .calpick-btn[aria-pressed="true"] small{ color:var(--accent); }

  .days{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dchip{ position:relative; font-size:12px; color:var(--text); background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:5px 0 6px; line-height:1.25; }
  .dchip .num{ font-size:15px; display:block; }
  .dchip.sun, .dchip.hol{ color:var(--sun-holiday); }
  .dchip.sat{ color:var(--sat); }
  .dchip[aria-pressed="true"]{ background:var(--accent-tint); border-color:var(--accent); font-weight:700; }
  .dchip.mine::after{ content:''; position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  /* 今日の曜日。どの日が今日かひと目で分かるように「今日」と出す。
     ほかの曜日にも同じ高さの空の行を置いて、ボタンの高さをそろえる */
  .dchip .tdy{ display:block; font-size:9.5px; line-height:1.35; min-height:1.35em; font-weight:700; color:var(--accent); }
  .dchip.tday{ border-color:var(--accent); }
  .dchip.tday .num{ font-weight:700; }
  .legend{ font-size:11.5px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; }
  .legend i{ display:inline-block; width:14px; height:8px; border-radius:3px; vertical-align:middle; margin-right:4px; }
  .board{ background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:10px 12px 12px; }
  .board h2{ margin:0 0 8px; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; }
  .board h2 span{ font-size:12px; font-weight:400; color:var(--text-muted); }
  .axis, .line{ display:grid; grid-template-columns:74px 1fr; gap:8px; align-items:center; }
  .axis .scale{ position:relative; height:15px; font-size:10.5px; color:var(--text-muted); }
  .axis .scale span{ position:absolute; transform:translateX(-50%); }
  .line{ padding:7px 0; border-top:1px solid var(--line); }
  .line .nm{ font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .line .tt{ font-size:11px; color:var(--text-muted); }
  .track{ position:relative; height:22px; background:var(--surface-2); border-radius:4px; }
  .seg{ position:absolute; top:3px; bottom:3px; background:var(--bar); border-radius:4px; }
  .seg.brk{ background:var(--bar-break); border-radius:0; }
  .line.me{ background:var(--accent-tint); margin:0 -12px; padding:7px 12px; }
  .line.me .nm{ font-weight:700; color:var(--accent); }
  .line.me .seg{ background:var(--accent); }
  .line.me .seg.brk{ background:var(--bar-break); }
  .empty{ padding:24px 14px; text-align:center; color:var(--text-muted); font-size:13px;
    background:var(--surface); border-radius:14px; box-shadow:var(--shadow); }
</style>
</head>
<body>
<div class="wrap">
  <!-- 名前を選ぶ -->
  <section id="pick" class="pick" hidden>
    <h1>自分の名前を選んでください</h1>
    <p>次からは、この画面は出ません。</p>
    <div class="names" id="names"></div>
  </section>

  <!-- シフト -->
  <section id="main" hidden style="display:flex;flex-direction:column;gap:14px">
    <header>
      <div>
        <h1 id="title"></h1>
        <p id="sub"></p>
      </div>
      <button type="button" class="change" id="changeName">名前を変える</button>
    </header>

    <div class="mode" role="group" aria-label="表示の切り替え">
      <button type="button" id="modeMine" aria-pressed="true">自分のシフト</button>
      <button type="button" id="modeAll" aria-pressed="false">全員のシフト</button>
    </div>

    <div class="tabs" id="tabs" role="group" aria-label="週を選ぶ"></div>

    <section id="mineView" style="display:flex;flex-direction:column;gap:14px">
      <section class="next" id="next" aria-label="次の出勤"></section>
      <section class="next soon" id="next2" aria-label="明日の出勤" hidden></section>
      <section class="list" id="list"></section>
      <button type="button" class="cal" id="calBtn">カレンダーに登録する</button>
      <div class="calbox" id="calBox" hidden></div>
      <button type="button" class="cal" id="payBtn">はたらいた時間とお給料（目安）を見る</button>
      <div class="calbox" id="payBox" hidden></div>
    </section>

    <section id="allView" hidden style="flex-direction:column;gap:10px">
      <div class="days" id="days" role="group" aria-label="日を選ぶ"></div>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>自分</span>
        <span><i style="background:var(--bar)"></i>ほかの人</span>
        <span><i style="background:var(--bar-break);border:1px solid var(--line)"></i>休憩</span>
        <span>●＝自分の出勤日</span>
      </div>
      <section class="board" id="board"></section>
    </section>
  </section>

  <div class="empty" id="noWeeks" hidden>まだ公開されたシフトがありません。</div>
</div>

<script>
  var DATA = <?!= dataJson ?>;
  var DOW = ['月', '火', '水', '木', '金', '土', '日'];
  var STORE_KEY = 'shiftName';
  var OPEN = '09:00', CLOSE = '21:30';
  var state = { who: '', week: 0, day: 0, mode: 'mine' };
  var payShownFor = '';          // お給料を出している人（名前が変わったら閉じる）

  function el(id){ return document.getElementById(id); }
  function mins(t){ var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function fmt(t){ return String(t).replace(/^0(\d:)/, '$1'); }
  function hours(p){
    var h = (mins(p.end) - mins(p.start)) / 60;
    if (p.breakStart && p.breakEnd) h -= (mins(p.breakEnd) - mins(p.breakStart)) / 60;
    return Math.round(h * 100) / 100;
  }
  function flat(n){ return String(n).replace(/[\s　]+/g, ''); }
  function mineOf(w, d){
    var list = DATA.weeks[w].days[d].filter(function(p){ return flat(p.name) === flat(state.who); });
    return list.length ? list[0] : null;
  }
  function dayClass(w, d){
    if (DATA.holidays[DATA.weeks[w].ymds[d]]) return 'hol';
    return d === 6 ? 'sun' : (d === 5 ? 'sat' : '');
  }
  function weekRange(w){ return DATA.weeks[w].labels[0] + '〜' + DATA.weeks[w].labels[6]; }
  // '20261012' の n 日あと
  function ymdPlus(ymd, n){
    var t = new Date(Number(ymd.slice(0, 4)), Number(ymd.slice(4, 6)) - 1, Number(ymd.slice(6, 8)) + n);
    return t.getFullYear() + ('0' + (t.getMonth() + 1)).slice(-2) + ('0' + t.getDate()).slice(-2);
  }
  // その日の自分のシフト（出ていなければ null）
  function dayOf(ymd){
    for (var w = 0; w < DATA.weeks.length; w++) {
      for (var d = 0; d < 7; d++) {
        if (DATA.weeks[w].ymds[d] === ymd && mineOf(w, d)) return { w: w, d: d, p: mineOf(w, d) };
      }
    }
    return null;
  }
  // その日から先で、いちばん近い自分の出勤日
  function nextFrom(ymd){
    for (var w = 0; w < DATA.weeks.length; w++) {
      for (var d = 0; d < 7; d++) {
        if (DATA.weeks[w].ymds[d] >= ymd && mineOf(w, d)) return { w: w, d: d, p: mineOf(w, d) };
      }
    }
    return null;
  }
  // この人の締め期間（キャストと店長・社員で締め日が違う）
  function myPeriod(w){
    var pd = DATA.weeks[w].period;
    if (!pd) return null;
    return (DATA.employees || []).indexOf(state.who) === -1 ? pd.cast : pd.emp;
  }
  function save(name){ try { localStorage.setItem(STORE_KEY, name); } catch (e) {} }
  function load(){ try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; } }

  /* ===== 名前を選ぶ ===== */
  el('names').innerHTML = DATA.names.map(function(n){
    return '<button type="button" data-n="' + n + '">' + n + '</button>';
  }).join('');
  el('names').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    state.who = b.getAttribute('data-n');
    save(state.who);
    start();
  });
  el('changeName').addEventListener('click', function(){
    el('main').hidden = true;
    el('pick').hidden = false;
  });

  /* ===== 週・表示の切り替え ===== */
  el('modeMine').addEventListener('click', function(){ state.mode = 'mine'; render(); });
  el('modeAll').addEventListener('click', function(){ state.mode = 'all'; render(); });
  el('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if (!t) return;
    state.week = Number(t.getAttribute('data-i'));
    state.day = firstMineDay(state.week);
    render();
  });
  el('days').addEventListener('click', function(e){
    var c = e.target.closest('.dchip');
    if (!c) return;
    state.day = Number(c.getAttribute('data-i'));
    render();
  });
  el('calBtn').addEventListener('click', function(){
    var box = el('calBox');
    box.hidden = !box.hidden;
    el('calBtn').textContent = box.hidden ? 'カレンダーに登録する' : '閉じる';
  });

  // はたらいた時間とお給料（目安）。ほかの人に見えないよう、誕生日の月日4けたで確かめる
  el('payBtn').addEventListener('click', function(){
    var box = el('payBox');
    box.hidden = !box.hidden;
    el('payBtn').textContent = box.hidden ? 'はたらいた時間とお給料（目安）を見る' : '閉じる';
    if (!box.hidden) askBirth();
  });

  function askBirth(msg){
    el('payBox').innerHTML =
      '<div class="lead">ほかの人に見えないように、<b>自分のスマホ</b>と<b>自分の誕生日</b>の2つで確かめます。</div>' +
      '<div class="hint" style="margin-bottom:6px;">' + (state.who || '') +
      ' さんの誕生日の<b>月日を4けた</b>で入れてください（1月31日なら 0131）。</div>' +
      '<div style="display:flex;gap:8px;align-items:center;">' +
      '<input id="birthCode" inputmode="numeric" maxlength="4" placeholder="0131" ' +
      'style="width:90px;padding:8px;font-size:16px;text-align:center;border:1px solid var(--line);border-radius:8px;">' +
      '<button type="button" class="calgo" id="payGo" style="margin:0;">見る</button></div>' +
      (msg ? '<div class="hint" style="color:#c0392b;margin-top:8px;">' + msg + '</div>' : '');
    el('payGo').addEventListener('click', loadPay);
    el('birthCode').addEventListener('keydown', function(e){ if (e.key === 'Enter') loadPay(); });
  }

  // シフト希望フォームがこのスマホに保存した番号。持ち主かどうかの確認に使う
  function deviceId(){
    try { return localStorage.getItem('shiftRequestDeviceId') || ''; } catch (e) { return ''; }
  }

  function loadPay(){
    var code = el('birthCode').value;
    el('payBox').innerHTML = '<div class="hint">調べています…</div>';
    google.script.run
      .withSuccessHandler(showPay)
      .withFailureHandler(function(){ askBirth('うまく読めませんでした。もう一度お願いします。'); })
      .myPayInfo(state.who, code, deviceId());
  }

  function yen(n){ return n.toLocaleString('ja-JP'); }

  function showPay(res){
    if (!res || !res.ok) { askBirth(res ? res.message : 'うまく読めませんでした。'); return; }
    el('payBox').innerHTML =
      res.periods.map(function(p){
        return '<div style="margin-bottom:12px;">' +
          '<h3>' + p.label + (p.ongoing ? '（いまの分・とちゅう）' : '') + '</h3>' +
          '<div class="hint">' + p.range + '</div>' +
          '<div style="margin-top:4px;">出勤 <b>' + p.days + '</b> 日　はたらいた時間 <b>' + p.hours + '</b> 時間</div>' +
          '<div class="hint">時給 ' + yen(p.wage) + '円 × ' + p.hours + '時間 ＝ ' + yen(p.pay) + '円' +
          (p.fare ? '　＋ 交通費 ' + yen(p.fare) + '円' : '') + '</div>' +
          '<div style="margin-top:4px;font-size:16px;">合計 <b>' + yen(p.total) + '</b> 円</div>' +
          '</div>';
      }).join('<div class="sep"></div>') +
      '<div class="hint">※ <b>目安の金額</b>です。店長が出勤を記録したぶんだけ数えています。' +
      '実際にもらう金額（税金や手当など）とは違うことがあります。</div>';
  }

  // いちばん下の合計。週ごとではなく、その週がふくまれる締め期間（締め日まで）で出す
  function totalLine(w){
    var pd = myPeriod(w);
    if (!pd) return '';
    var days = 0, total = 0;
    DATA.weeks.forEach(function(wk, wi){
      wk.ymds.forEach(function(ymd, d){
        if (ymd < pd.from || ymd > pd.to) return;
        var p = mineOf(wi, d);
        if (!p) return;
        days++; total += hours(p);
      });
    });
    return '<div class="total"><span>' + pd.label + 'までの合計</span>' +
      '<span><b class="num">' + days + '</b> 日　<b class="num">' + Math.round(total * 100) / 100 + '</b> 時間</span></div>';
  }

  // 出勤の帯を1枚ぶん作る（2行：見出しと日付／時間と休憩）
  function card(box, head, hit){
    box.hidden = !hit;
    if (!hit) { box.innerHTML = ''; return; }
    var ymd = DATA.weeks[hit.w].ymds[hit.d];
    var hol = DATA.holidays[ymd];
    box.className = head === '本日出勤' ? 'next' : 'next soon';
    box.setAttribute('aria-label', head);
    box.innerHTML = '<div class="d">' + head +
      '<span class="dd num">' + DATA.weeks[hit.w].labels[hit.d] + '（' + DOW[hit.d] + (hol ? '・祝' : '') + '）</span></div>' +
      '<div class="t num">' + fmt(hit.p.start) + ' – ' + fmt(hit.p.end) +
      '<span class="b">' + (hit.p.breakStart ? '休憩 ' + fmt(hit.p.breakStart) + ' – ' + fmt(hit.p.breakEnd) : '休憩なし') +
      '</span></div>';
  }

  function firstMineDay(w){
    for (var d = 0; d < 7; d++) if (mineOf(w, d)) return d;
    return 0;
  }

  /* ===== 自分のシフト ===== */
  function renderMine(){
    var w = state.week;
    el('list').innerHTML = DATA.weeks[w].days.map(function(_, d){
      var p = mineOf(w, d), ymd = DATA.weeks[w].ymds[d];
      var cls = ['row', dayClass(w, d)];
      if (!p) cls.push('off');
      if (ymd === DATA.today) cls.push('today');
      var hol = DATA.holidays[ymd];
      var head = '<div class="day"><span class="num">' + DATA.weeks[w].labels[d] + '</span>（' + DOW[d] + '）' +
        (ymd === DATA.today ? '<span class="tag">今日</span>' : '') +
        (hol ? '<div class="br">' + hol + '</div>' : '') + '</div>';
      if (!p) return '<div class="' + cls.join(' ') + '">' + head + '<div class="tm">休み</div></div>';
      var h = hours(p);
      return '<div class="' + cls.join(' ') + '">' + head + '<div><div class="tm num">' + fmt(p.start) + ' – ' + fmt(p.end) + '</div>' +
        '<div class="br">' + (p.breakStart ? '休憩 ' + fmt(p.breakStart) + ' – ' + fmt(p.breakEnd) + '　' : '') + '実働 ' + h + '時間</div></div></div>';
    }).join('') +
      totalLine(w);

    // 上の帯：本日出勤は赤、明日出勤は緑。どちらも無ければ、いちばん近い出勤日を緑で出す
    var hitToday = dayOf(DATA.today);
    var hitTomorrow = dayOf(ymdPlus(DATA.today, 1));
    card(el('next'), '本日出勤', hitToday);
    card(el('next2'), '明日出勤', hitTomorrow);
    if (!hitToday && !hitTomorrow) card(el('next'), '次の出勤', nextFrom(DATA.today));

    // 名前を変えたら、前の人のお給料は閉じる（他の人に見えないように）
    if (payShownFor !== state.who) {
      payShownFor = state.who;
      el('payBox').hidden = true;
      el('payBox').innerHTML = '';
      el('payBtn').textContent = 'はたらいた時間とお給料（目安）を見る';
    }
    var isStaff = (DATA.employees || []).indexOf(state.who) === -1;
    el('payBtn').hidden = !isStaff;          // 店長・社員には出さない

    var key = DATA.keys[state.who] || '';
    if (!key) { el('calBox').innerHTML = '<div class="hint">この名前のシフトがまだありません。</div>'; return; }
    var url = DATA.selfUrl + '?cal=' + key;
    var webcal = url.replace(/^https:\/\//, 'webcal://');
    var googleUrl = 'https://calendar.google.com/calendar/render?cid=' + encodeURIComponent(webcal);
    var iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

    // どちらの人も同じ形（説明→手順→ボタン）にして、上のタブで選ぶ
    var forIphone =
      '<div class="lead">ボタンを押すと、<b>iPhoneの「カレンダー」アプリが自動で開きます</b>。' +
      'この画面はそのままで大丈夫です。</div>' +
      '<ol class="steps"><li>下のボタンを押す</li>' +
      '<li>カレンダーが開き、「照会するカレンダーを追加しますか？」と出る → <b>「登録」</b> を押す</li>' +
      '<li>「完了」を押すと、カレンダーに「シフト（' + DATA.storeName + '）」が増えます</li>' +
      '<li>終わったら、この画面に戻ってきて大丈夫です</li></ol>' +
      '<a class="calgo" href="' + webcal + '">iPhoneのカレンダーに登録</a>';
    var forGoogle =
      '<div class="lead">ボタンを押すと、<b>Googleカレンダーの画面がブラウザで開きます</b>。' +
      'アプリではなく、パソコン向けの画面が出ます。</div>' +
      '<ol class="steps"><li>下のボタンを押す</li>' +
      '<li>Googleカレンダーの画面が開く → 右上の <b>︙</b> →「<b>PC版サイト</b>」にチェックを入れる</li>' +
      '<li>「カレンダーを追加しますか？」と出る → <b>「追加」</b> を押す</li>' +
      '<li>Googleカレンダーのアプリに戻り、☰ →「設定」→「シフト（' + DATA.storeName + '）」→「<b>同期</b>」をオン</li></ol>' +
      '<a class="calgo" href="' + googleUrl + '">Googleカレンダーに登録</a>';

    el('calBox').innerHTML =
      '<h3>ふだん使っているカレンダーを選んでください</h3>' +
      '<div class="calpick" id="calPick">' +
      '<button type="button" class="calpick-btn" data-k="g">Googleカレンダー<small>Android・Gmailの人</small></button>' +
      '<button type="button" class="calpick-btn" data-k="i">iPhoneのカレンダー<small>iPhone・iPadの人</small></button>' +
      '</div>' +
      '<div id="calBody"></div>' +
      '<div class="sep"></div>' +
      '<div class="hint">登録は最初の1回だけです。シフトが変わると自動で書き換わります。<br>' +
      'シフトボードやタイムツリーを使っている人は、登録したあとアプリの設定で「本体カレンダーの予定を読込」をオンにすると表示されます（給料の計算には入りません）。</div>';

    // はじめは機種に合うほうを開いておく（違っていれば、もう一方を押してもらう）
    function pickCal(kind) {
      el('calBody').innerHTML = kind === 'i' ? forIphone : forGoogle;
      Array.prototype.forEach.call(el('calPick').children, function(b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-k') === kind ? 'true' : 'false');
      });
    }
    el('calPick').addEventListener('click', function(e) {
      var b = e.target.closest('.calpick-btn');
      if (b) pickCal(b.getAttribute('data-k'));
    });
    pickCal(iOS ? 'i' : 'g');
  }

  /* ===== 全員のシフト ===== */
  function pos(t){ return ((mins(t) - mins(OPEN)) / (mins(CLOSE) - mins(OPEN)) * 100).toFixed(2) + '%'; }
  function seg(a, b, cls){
    return '<span class="seg' + (cls ? ' ' + cls : '') + '" style="left:' + pos(a) + ';width:calc(' + pos(b) + ' - ' + pos(a) + ')"></span>';
  }
  function renderAll(){
    var w = state.week, d = state.day;
    el('days').innerHTML = DOW.map(function(dw, i){
      var cls = ['dchip', dayClass(w, i)];
      if (mineOf(w, i)) cls.push('mine');
      var isToday = DATA.weeks[w].ymds[i] === DATA.today;
      if (isToday) cls.push('tday');
      return '<button type="button" class="' + cls.join(' ') + '" data-i="' + i + '" aria-pressed="' + (i === d) + '"' +
        (isToday ? ' aria-label="今日 ' + dw + ' ' + DATA.weeks[w].labels[i] + '"' : '') + '>' +
        dw + '<span class="num">' + DATA.weeks[w].labels[i].split('/')[1] + '</span>' +
        '<span class="tdy">' + (isToday ? '今日' : '') + '</span></button>';
    }).join('');

    var ppl = DATA.weeks[w].days[d];
    var ticks = [9, 11, 13, 15, 17, 19, 21].map(function(h){
      return '<span style="left:' + pos(h + ':00') + '">' + h + '</span>';
    }).join('');
    var hol = DATA.holidays[DATA.weeks[w].ymds[d]];
    el('board').innerHTML =
      '<h2>' + DATA.weeks[w].labels[d] + '（' + DOW[d] + (hol ? '・' + hol : '') + '）<span>' + ppl.length + '人</span></h2>' +
      '<div class="axis"><span></span><div class="scale num">' + ticks + '</div></div>' +
      (ppl.length ? ppl.map(function(p){
        var bars = p.breakStart && p.breakEnd
          ? seg(p.start, p.breakStart) + seg(p.breakStart, p.breakEnd, 'brk') + seg(p.breakEnd, p.end)
          : seg(p.start, p.end);
        return '<div class="line' + (flat(p.name) === flat(state.who) ? ' me' : '') + '">' +
          '<div><div class="nm">' + p.name + '</div><div class="tt num">' + fmt(p.start) + '–' + fmt(p.end) + '</div></div>' +
          '<div class="track">' + bars + '</div></div>';
      }).join('') : '<div class="line"><div class="nm">出勤なし</div><div></div></div>');
  }

  function render(){
    el('title').textContent = state.who + 'さんのシフト';
    el('sub').textContent = DATA.storeName;
    el('modeMine').setAttribute('aria-pressed', String(state.mode === 'mine'));
    el('modeAll').setAttribute('aria-pressed', String(state.mode === 'all'));
    Array.prototype.forEach.call(el('tabs').children, function(t){
      t.setAttribute('aria-pressed', String(Number(t.getAttribute('data-i')) === state.week));
    });
    el('mineView').hidden = state.mode !== 'mine';
    el('allView').hidden = state.mode !== 'all';
    el('mineView').style.display = state.mode === 'mine' ? 'flex' : '';
    el('allView').style.display = state.mode === 'all' ? 'flex' : '';
    if (state.mode === 'mine') renderMine(); else renderAll();
  }

  function start(){
    el('pick').hidden = true;
    el('main').hidden = false;
    el('main').style.display = 'flex';
    state.day = firstMineDay(state.week);
    render();
  }

  /* ===== 開いたとき ===== */
  (function init(){
    if (!DATA.weeks.length) { el('noWeeks').hidden = false; return; }

    // 終わった週（past）はタブに出さない。合計を出すのには使うので、中身は持っている
    var shown = DATA.weeks.map(function(wk, i){ return { wk: wk, i: i }; })
      .filter(function(x){ return !x.wk.past; });
    el('tabs').style.gridTemplateColumns = 'repeat(' + Math.min(Math.max(shown.length, 1), 4) + ',1fr)';
    el('tabs').innerHTML = shown.map(function(x){
      var wk = x.wk;
      var label = wk.ymds[0] <= DATA.today && DATA.today <= wk.ymds[6] ? '今週' : '';
      return '<button type="button" class="tab" data-i="' + x.i + '">' + (label ? label + '<br>' : '') +
        '<span class="num">' + wk.labels[0] + '〜' + wk.labels[6] + '</span></button>';
    }).join('');

    // 開く週：お知らせのリンクで指定された週 → 今週 → 一番新しい週
    var open = -1;
    DATA.weeks.forEach(function(wk, i){
      if (DATA.openWeek && wk.sheet === DATA.openWeek) open = i;
    });
    if (open < 0) DATA.weeks.forEach(function(wk, i){
      if (wk.ymds[0] <= DATA.today && DATA.today <= wk.ymds[6]) open = i;
    });
    // 終わった週はタブに出していないので、そこを開かない（古いお知らせのリンクを押したとき）
    if (open < 0 || DATA.weeks[open].past) {
      open = -1;
      DATA.weeks.forEach(function(wk, i){ if (open < 0 && !wk.past) open = i; });
    }
    state.week = open >= 0 ? open : DATA.weeks.length - 1;

    var saved = load();
    var known = DATA.names.filter(function(n){ return flat(n) === flat(saved); });
    if (known.length) { state.who = known[0]; start(); }
    else el('pick').hidden = false;
  })();
</script>
</body>
</html>
