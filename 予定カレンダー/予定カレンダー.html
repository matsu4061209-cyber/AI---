<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予定カレンダー</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --ink:#1f2328;
    --muted:#9aa2ad;
    --line:#e3e6ea;
    --head:#2d3340;
    --today:#fff7e6;
    --today-ring:#f0a020;
    --sun:#d64545;
    --sat:#2f6fd0;
    --chip:#eef3fb;
    --chip-ink:#1f4b8f;
    --accent:#2f6fd0;
    --recur:#e7f5ea; --recur-ink:#1f7a3a;
    --shadow:0 2px 10px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171c; --panel:#1c2128; --ink:#e6e9ee; --muted:#6b7480;
      --line:#2b313a; --head:#e6e9ee; --today:#2a2416; --today-ring:#d8912a;
      --sun:#ff7b7b; --sat:#74a9ff; --chip:#1e2a3d; --chip-ink:#9ec5ff;
      --accent:#74a9ff; --recur:#19271d; --recur-ink:#7fd79a;
      --shadow:0 2px 12px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --panel:#1c2128; --ink:#e6e9ee; --muted:#6b7480;
    --line:#2b313a; --head:#e6e9ee; --today:#2a2416; --today-ring:#d8912a;
    --sun:#ff7b7b; --sat:#74a9ff; --chip:#1e2a3d; --chip-ink:#9ec5ff;
    --accent:#74a9ff; --recur:#19271d; --recur-ink:#7fd79a;
    --shadow:0 2px 12px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* 上のバー */
  header.bar{
    display:flex; align-items:center; gap:14px;
    padding:10px 18px; background:var(--panel);
    border-bottom:1px solid var(--line); box-shadow:var(--shadow); z-index:5;
  }
  header.bar h1{font-size:18px; margin:0; letter-spacing:.5px; white-space:nowrap;}
  header.bar .spacer{flex:1;}
  button.btn{
    font:inherit; font-size:14px; cursor:pointer;
    background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:7px 14px;
    transition:background .12s, border-color .12s;
  }
  button.btn:hover{border-color:var(--accent); color:var(--accent);}
  button.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.btn.primary:hover{opacity:.9; color:#fff;}
  .hint{font-size:12px; color:var(--muted); white-space:nowrap;}

  /* カレンダー本体 */
  main{flex:1; display:flex; gap:16px; padding:16px; min-height:0;}
  .month{
    flex:1; display:flex; flex-direction:column; min-width:0;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
  }
  .month-title{
    text-align:center; font-size:20px; font-weight:700;
    padding:12px 0 10px; color:var(--head);
  }
  .weekdays{
    display:grid; grid-template-columns:repeat(7,1fr);
    border-bottom:1px solid var(--line);
  }
  .weekdays div{
    text-align:center; font-size:13px; font-weight:600;
    padding:6px 0; color:var(--muted);
  }
  .weekdays div.sun{color:var(--sun);}
  .weekdays div.sat{color:var(--sat);}

  .grid{
    flex:1; display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:1fr;
    min-height:0;
  }
  .cell{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:4px 5px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; min-height:0;
    transition:background .1s;
  }
  .cell:nth-child(7n){border-right:none;}
  .cell:hover{background:var(--chip);}
  .cell.other{color:var(--muted); background:transparent;}
  .cell.other .num{opacity:.5;}
  .cell.today{background:var(--today); box-shadow:inset 0 0 0 2px var(--today-ring);}
  .num{font-size:26px; font-weight:700; line-height:1.2; flex:none;}
  .num.sun{color:var(--sun);}
  .num.sat{color:var(--sat);}
  .num.holiday{color:var(--sun);}
  .holi-name{
    font-size:11px; color:var(--sun); font-weight:600;
    line-height:1.2; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cell.holiday{background:rgba(214,69,69,.06);}
  .cell.holiday:hover{background:var(--chip);}
  .events{margin-top:2px; overflow:hidden; display:flex; flex-direction:column; gap:2px;}
  .ev{
    background:var(--chip); color:var(--chip-ink);
    font-size:11.5px; line-height:1.3; border-radius:4px;
    padding:1px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ev.recur{background:var(--recur); color:var(--recur-ink);}
  .more{font-size:11px; color:var(--muted); padding:0 3px;}

  /* 入力ダイアログ */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .overlay.open{display:flex;}
  .dialog{
    background:var(--panel); color:var(--ink);
    width:min(420px,92vw); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.3);
    padding:20px; max-height:86vh; display:flex; flex-direction:column;
  }
  .dialog h2{margin:0 0 14px; font-size:17px;}
  .ev-list{list-style:none; margin:0 0 14px; padding:0; overflow:auto;}
  .ev-list li{
    display:flex; align-items:center; gap:8px;
    background:var(--chip); border-radius:8px; padding:7px 10px; margin-bottom:6px;
  }
  .ev-list li span{flex:1; font-size:14px; word-break:break-word;}
  .ev-list li button{
    border:none; background:transparent; color:var(--sun);
    font-size:18px; cursor:pointer; line-height:1; padding:2px 6px;
  }
  .ev-empty{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .add-row{display:flex; gap:8px;}
  .add-row input{
    flex:1; font:inherit; font-size:14px; padding:9px 11px;
    border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink);
  }
  .add-row input:focus{outline:none; border-color:var(--accent);}
  .add-row select{
    font:inherit; font-size:14px; padding:9px 8px;
    border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink);
  }
  .dialog-foot{display:flex; justify-content:flex-end; margin-top:16px;}
  .recur-head{font-size:12px; font-weight:700; color:var(--recur-ink); margin:0 0 6px;}
  .ev-list li.recur{background:var(--recur);}
  .ev-list li.recur span{color:var(--recur-ink);}
</style>
</head>
<body>
  <header class="bar">
    <h1>📅 予定カレンダー</h1>
    <button class="btn" id="prev">◀ 前へ</button>
    <button class="btn" id="todayBtn">今月</button>
    <button class="btn" id="next">次へ ▶</button>
    <button class="btn" id="recurBtn">🔁 毎月の予定</button>
    <span class="spacer"></span>
    <span class="hint">日付をクリックして予定を書き込めます（この端末に自動保存）</span>
  </header>

  <main>
    <section class="month" id="monthLeft"></section>
    <section class="month" id="monthRight"></section>
  </main>

  <!-- 入力ダイアログ -->
  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="dlgTitle">予定</h2>
      <p class="recur-head" id="dlgRecurHead" style="display:none;">🔁 毎月の予定</p>
      <ul class="ev-list" id="dlgRecur"></ul>
      <ul class="ev-list" id="dlgList"></ul>
      <p class="ev-empty" id="dlgEmpty">まだ予定はありません。</p>
      <div class="add-row">
        <input type="text" id="dlgInput" placeholder="予定を入力してEnter（例：13時 本部会議）" autocomplete="off">
        <button class="btn primary" id="dlgAdd">追加</button>
      </div>
      <div class="dialog-foot">
        <button class="btn" id="dlgClose">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 毎月の予定 管理ダイアログ -->
  <div class="overlay" id="recurOverlay">
    <div class="dialog">
      <h2>🔁 毎月くり返す予定</h2>
      <ul class="ev-list" id="recurList"></ul>
      <p class="ev-empty" id="recurEmpty">まだ登録がありません。「○日」と内容を選んで追加してください。</p>
      <div class="add-row">
        <select id="recurDay"></select>
        <input type="text" id="recurText" placeholder="内容（例：給料日・棚卸）" autocomplete="off">
        <button class="btn primary" id="recurAdd">追加</button>
      </div>
      <div class="dialog-foot">
        <button class="btn" id="recurClose">閉じる</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var STORE_KEY = "yotei_calendar_v1";
  var RECUR_KEY = "yotei_recurring_v1";
  var WEEK = ["日","月","火","水","木","金","土"];

  // ---- 保存データ ----
  var data = {};
  var recurring = [];   // [{day:1..31 または "last", text:"..."}]
  function load(){
    try{ var raw = localStorage.getItem(STORE_KEY); if(raw) data = JSON.parse(raw)||{}; }
    catch(e){ data = {}; }
    try{ var r = localStorage.getItem(RECUR_KEY); if(r) recurring = JSON.parse(r)||[]; }
    catch(e){ recurring = []; }
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
    catch(e){ /* プライベートモード等では保存できない場合があります */ }
  }
  function saveRecurring(){
    try{ localStorage.setItem(RECUR_KEY, JSON.stringify(recurring)); }
    catch(e){}
  }
  // その日に当てはまる「毎月の予定」を返す
  function recurringFor(y,m,d){
    var last = new Date(y, m+1, 0).getDate();
    var out = [];
    recurring.forEach(function(r){
      if(r.day==="last"){ if(d===last) out.push(r.text); }
      else if(r.day===d){ out.push(r.text); }   // 無い日(31日など)は自動で出ない
    });
    return out;
  }
  function key(y,m,d){ return y+"-"+(m+1)+"-"+d; }
  function dkey(dt){ return key(dt.getFullYear(), dt.getMonth(), dt.getDate()); }

  // ---- 祝日の自動計算（現行法） ----
  var holCache = {};
  function springEquinox(y){ return Math.floor(20.8431 + 0.242194*(y-1980) - Math.floor((y-1980)/4)); }
  function autumnEquinox(y){ return Math.floor(23.2488 + 0.242194*(y-1980) - Math.floor((y-1980)/4)); }
  function nthMonday(y, mi, n){
    var firstDow = new Date(y, mi, 1).getDay();
    return 1 + ((1 - firstDow + 7) % 7) + (n-1)*7; // mi月のn番目の月曜
  }
  function getHolidays(year){
    if(holCache[year]) return holCache[year];
    var nat = {};  // 国民の祝日
    var map = {};  // 表示用（祝日＋振替＋国民の休日）
    function add(mi,d,name){ var k=key(year,mi,d); nat[k]=name; map[k]=name; }

    add(0,1,"元日");
    add(1,11,"建国記念の日");
    add(1,23,"天皇誕生日");
    add(2, springEquinox(year), "春分の日");
    add(3,29,"昭和の日");
    add(4,3,"憲法記念日");
    add(4,4,"みどりの日");
    add(4,5,"こどもの日");
    add(7,11,"山の日");
    add(8, autumnEquinox(year), "秋分の日");
    add(10,3,"文化の日");
    add(10,23,"勤労感謝の日");
    add(0, nthMonday(year,0,2), "成人の日");
    add(6, nthMonday(year,6,3), "海の日");
    add(8, nthMonday(year,8,3), "敬老の日");
    add(9, nthMonday(year,9,2), "スポーツの日");

    var end = new Date(year,11,31);
    var dt, p, n;
    // 国民の休日（祝日と祝日に挟まれた平日）
    for(dt=new Date(year,0,2); dt<end; dt.setDate(dt.getDate()+1)){
      var k0 = dkey(dt);
      if(map[k0] || dt.getDay()===0) continue;
      p = new Date(dt); p.setDate(p.getDate()-1);
      n = new Date(dt); n.setDate(n.getDate()+1);
      if(nat[dkey(p)] && nat[dkey(n)]) map[k0] = "国民の休日";
    }
    // 振替休日（祝日が日曜 → 次の平日）
    for(dt=new Date(year,0,1); dt<=end; dt.setDate(dt.getDate()+1)){
      if(nat[dkey(dt)] && dt.getDay()===0){
        var nx = new Date(dt);
        do { nx.setDate(nx.getDate()+1); } while(map[dkey(nx)]);
        map[dkey(nx)] = "振替休日";
      }
    }
    holCache[year] = map;
    return map;
  }

  // ---- 表示している左の月 ----
  var today = new Date();
  var base = new Date(today.getFullYear(), today.getMonth(), 1);

  function sameDay(y,m,d){
    return y===today.getFullYear() && m===today.getMonth() && d===today.getDate();
  }

  function buildMonth(el, year, month){
    el.innerHTML = "";

    var title = document.createElement("div");
    title.className = "month-title";
    title.textContent = year + "年 " + (month+1) + "月";
    el.appendChild(title);

    var wd = document.createElement("div");
    wd.className = "weekdays";
    for(var i=0;i<7;i++){
      var w = document.createElement("div");
      w.textContent = WEEK[i];
      if(i===0) w.className="sun";
      if(i===6) w.className="sat";
      wd.appendChild(w);
    }
    el.appendChild(wd);

    var grid = document.createElement("div");
    grid.className = "grid";

    var first = new Date(year, month, 1);
    var startDow = first.getDay();
    var start = new Date(year, month, 1 - startDow); // 6週=42マス固定

    for(var n=0;n<42;n++){
      var dt = new Date(start.getFullYear(), start.getMonth(), start.getDate()+n);
      var y=dt.getFullYear(), m=dt.getMonth(), d=dt.getDate();
      var inMonth = (m===month);

      var holName = getHolidays(y)[key(y,m,d)];

      var cell = document.createElement("div");
      cell.className = "cell";
      if(!inMonth) cell.className += " other";
      if(holName) cell.className += " holiday";
      if(sameDay(y,m,d)) cell.className += " today";

      var dow = dt.getDay();
      var num = document.createElement("div");
      num.className = "num" + (holName?" holiday":dow===0?" sun":dow===6?" sat":"");
      num.textContent = d;
      cell.appendChild(num);

      if(holName){
        var hn = document.createElement("div");
        hn.className = "holi-name";
        hn.textContent = holName;
        hn.title = holName;
        cell.appendChild(hn);
      }

      var k = key(y,m,d);
      var list = data[k] || [];
      var recur = recurringFor(y,m,d);
      var all = recur.map(function(t){return {t:t, r:true};})
                     .concat(list.map(function(t){return {t:t, r:false};}));
      var box = document.createElement("div");
      box.className = "events";
      var show = Math.min(all.length, 4);
      for(var j=0;j<show;j++){
        var ev = document.createElement("div");
        ev.className = "ev" + (all[j].r ? " recur" : "");
        ev.textContent = all[j].t;
        box.appendChild(ev);
      }
      if(all.length>show){
        var more = document.createElement("div");
        more.className = "more";
        more.textContent = "＋" + (all.length-show) + "件";
        box.appendChild(more);
      }
      cell.appendChild(box);

      (function(yy,mm,dd){
        cell.addEventListener("click", function(){ openDialog(yy,mm,dd); });
      })(y,m,d);

      grid.appendChild(cell);
    }
    el.appendChild(grid);
  }

  function render(){
    var ly=base.getFullYear(), lm=base.getMonth();
    var right = new Date(ly, lm+1, 1);
    buildMonth(document.getElementById("monthLeft"), ly, lm);
    buildMonth(document.getElementById("monthRight"), right.getFullYear(), right.getMonth());
  }

  // ---- ダイアログ ----
  var cur = null;
  var overlay = document.getElementById("overlay");
  var dlgTitle = document.getElementById("dlgTitle");
  var dlgList = document.getElementById("dlgList");
  var dlgEmpty = document.getElementById("dlgEmpty");
  var dlgInput = document.getElementById("dlgInput");
  var dlgRecur = document.getElementById("dlgRecur");
  var dlgRecurHead = document.getElementById("dlgRecurHead");

  function openDialog(y,m,d){
    cur = {y:y,m:m,d:d,k:key(y,m,d)};
    var hol = getHolidays(y)[key(y,m,d)];
    dlgTitle.textContent = y+"年"+(m+1)+"月"+d+"日 ("+WEEK[new Date(y,m,d).getDay()]+")"
                           + (hol ? " ・ "+hol : "") + " の予定";
    dlgInput.value = "";
    refreshList();
    overlay.classList.add("open");
    dlgInput.focus();
  }
  function closeDialog(){ overlay.classList.remove("open"); cur=null; }

  function refreshList(){
    // 毎月の予定（読み取り専用）
    var rec = recurringFor(cur.y, cur.m, cur.d);
    dlgRecur.innerHTML = "";
    dlgRecurHead.style.display = rec.length ? "block" : "none";
    rec.forEach(function(text){
      var li = document.createElement("li");
      li.className = "recur";
      var span = document.createElement("span");
      span.textContent = text;
      li.appendChild(span);
      dlgRecur.appendChild(li);
    });

    var list = data[cur.k] || [];
    dlgList.innerHTML = "";
    dlgEmpty.style.display = list.length ? "none" : "block";
    list.forEach(function(text, idx){
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.textContent = text;
      var del = document.createElement("button");
      del.textContent = "×";
      del.title = "削除";
      del.addEventListener("click", function(){
        data[cur.k].splice(idx,1);
        if(data[cur.k].length===0) delete data[cur.k];
        save(); refreshList(); render();
      });
      li.appendChild(span); li.appendChild(del);
      dlgList.appendChild(li);
    });
  }

  function addEvent(){
    var t = dlgInput.value.trim();
    if(!t) return;
    if(!data[cur.k]) data[cur.k] = [];
    data[cur.k].push(t);
    save();
    dlgInput.value = "";
    refreshList(); render();
    dlgInput.focus();
  }

  document.getElementById("dlgAdd").addEventListener("click", addEvent);
  dlgInput.addEventListener("keydown", function(e){ if(e.key==="Enter") addEvent(); });
  document.getElementById("dlgClose").addEventListener("click", closeDialog);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeDialog(); });

  // ---- 毎月の予定 管理 ----
  var recurOverlay = document.getElementById("recurOverlay");
  var recurList = document.getElementById("recurList");
  var recurEmpty = document.getElementById("recurEmpty");
  var recurDay = document.getElementById("recurDay");
  var recurText = document.getElementById("recurText");

  // 日付セレクトを作る（毎月1日〜31日 ＋ 末日）
  (function(){
    for(var i=1;i<=31;i++){
      var o=document.createElement("option"); o.value=String(i); o.textContent="毎月"+i+"日";
      recurDay.appendChild(o);
    }
    var ol=document.createElement("option"); ol.value="last"; ol.textContent="毎月 末日";
    recurDay.appendChild(ol);
  })();

  function openRecur(){ refreshRecur(); recurOverlay.classList.add("open"); recurText.focus(); }
  function closeRecur(){ recurOverlay.classList.remove("open"); }

  function recurLabel(r){ return r.day==="last" ? "末日" : (r.day+"日"); }

  function refreshRecur(){
    recurList.innerHTML = "";
    recurEmpty.style.display = recurring.length ? "none" : "block";
    recurring.forEach(function(r, idx){
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.textContent = "毎月" + recurLabel(r) + "　" + r.text;
      var del = document.createElement("button");
      del.textContent = "×"; del.title = "削除";
      del.addEventListener("click", function(){
        recurring.splice(idx,1); saveRecurring(); refreshRecur(); render();
      });
      li.appendChild(span); li.appendChild(del);
      recurList.appendChild(li);
    });
  }

  function addRecur(){
    var t = recurText.value.trim();
    if(!t) return;
    var v = recurDay.value;
    recurring.push({ day: (v==="last" ? "last" : parseInt(v,10)), text: t });
    // 日付順に並べ替え（末日は最後）
    recurring.sort(function(a,b){
      var ad = a.day==="last" ? 99 : a.day, bd = b.day==="last" ? 99 : b.day;
      return ad - bd;
    });
    saveRecurring();
    recurText.value = "";
    refreshRecur(); render();
    recurText.focus();
  }

  document.getElementById("recurBtn").addEventListener("click", openRecur);
  document.getElementById("recurAdd").addEventListener("click", addRecur);
  recurText.addEventListener("keydown", function(e){ if(e.key==="Enter") addRecur(); });
  document.getElementById("recurClose").addEventListener("click", closeRecur);
  recurOverlay.addEventListener("click", function(e){ if(e.target===recurOverlay) closeRecur(); });

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ closeDialog(); closeRecur(); }
  });

  // ---- ナビ ----
  document.getElementById("prev").addEventListener("click", function(){
    base = new Date(base.getFullYear(), base.getMonth()-1, 1); render();
  });
  document.getElementById("next").addEventListener("click", function(){
    base = new Date(base.getFullYear(), base.getMonth()+1, 1); render();
  });
  document.getElementById("todayBtn").addEventListener("click", function(){
    base = new Date(today.getFullYear(), today.getMonth(), 1); render();
  });

  load();
  render();
})();
</script>
</body>
</html>
