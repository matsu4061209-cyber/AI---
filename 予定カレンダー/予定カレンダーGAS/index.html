<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<title>予定カレンダー</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2328; --muted:#9aa2ad;
    --line:#e3e6ea; --head:#2d3340; --today:#fff7e6; --today-ring:#f0a020;
    --sun:#d64545; --sat:#2f6fd0; --chip:#eef3fb; --chip-ink:#1f4b8f;
    --accent:#2f6fd0; --recur:#e7f5ea; --recur-ink:#1f7a3a;
    --shadow:0 2px 10px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171c; --panel:#1c2128; --ink:#e6e9ee; --muted:#6b7480;
      --line:#2b313a; --head:#e6e9ee; --today:#2a2416; --today-ring:#d8912a;
      --sun:#ff7b7b; --sat:#74a9ff; --chip:#1e2a3d; --chip-ink:#9ec5ff;
      --accent:#74a9ff; --recur:#19271d; --recur-ink:#7fd79a;
      --shadow:0 2px 12px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --panel:#1c2128; --ink:#e6e9ee; --muted:#6b7480;
    --line:#2b313a; --head:#e6e9ee; --today:#2a2416; --today-ring:#d8912a;
    --sun:#ff7b7b; --sat:#74a9ff; --chip:#1e2a3d; --chip-ink:#9ec5ff;
    --accent:#74a9ff; --recur:#19271d; --recur-ink:#7fd79a;
    --shadow:0 2px 12px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Meiryo","BIZ UDPGothic","Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  header.bar{
    display:flex; align-items:center; gap:8px;
    padding:3px 12px; background:var(--panel);
    border-bottom:1px solid var(--line); box-shadow:var(--shadow); z-index:5;
    flex-wrap:nowrap; overflow:hidden;        /* 常に1行を維持 */
  }
  header.bar h1{font-size:15px; margin:0; letter-spacing:.3px; white-space:nowrap; flex:none;}
  header.bar .spacer{flex:1 1 auto; min-width:0;}
  button.btn{
    font:inherit; font-size:13px; cursor:pointer; white-space:nowrap;
    background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px;
    transition:background .12s, border-color .12s; flex:none;
  }
  button.btn:hover{border-color:var(--accent); color:var(--accent);}
  button.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.btn.primary:hover{opacity:.9; color:#fff;}
  button.btn:disabled{opacity:.5; cursor:default;}
  .hint{font-size:11px; color:var(--muted); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; text-align:right;}
  .status{font-size:12px; color:var(--muted); white-space:nowrap; min-width:70px;}
  .status.err{color:var(--sun); font-weight:600;}

  main{flex:1; display:flex; gap:16px; padding:16px; min-height:0;}
  .month{
    flex:1; display:flex; flex-direction:column; min-width:0;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
  }
  .month-title{text-align:center; font-size:16px; font-weight:700; padding:5px 0 4px; color:var(--head);}
  .weekdays{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line);}
  .weekdays div{text-align:center; font-size:12px; font-weight:600; padding:3px 0; color:var(--muted);}
  .weekdays div.sun{color:var(--sun);}
  .weekdays div.sat{color:var(--sat);}

  .grid{flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; min-height:0;}
  .cell{
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:2px 5px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; min-height:0; transition:background .1s;
  }
  .cell:nth-child(7n){border-right:none;}
  .cell:hover{background:var(--chip);}
  .cell.other{background:transparent; opacity:.45;}
  .cell.today{background:var(--today); box-shadow:inset 0 0 0 2px var(--today-ring);}
  .num{font-size:clamp(11px, 1.15vw, 18px); font-weight:700; line-height:1.05; flex:none;}
  .num.sun{color:var(--sun);}
  .num.sat{color:var(--sat);}
  .num.holiday{color:var(--sun);}
  .holi-name{
    font-size:clamp(8px, 0.72vw, 12px); color:var(--sun); font-weight:600;
    line-height:1.0; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cell.holiday{background:rgba(214,69,69,.06);}
  .cell.holiday:hover{background:var(--chip);}
  .events{margin-top:0; overflow:hidden; display:flex; flex-direction:column; gap:1px;}
  .ev{
    background:var(--chip); color:var(--chip-ink);
    font-size:clamp(8px, 0.72vw, 12px); line-height:1.15; border-radius:4px;
    padding:0 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ev.recur{background:var(--recur); color:var(--recur-ink);}
  .more{font-size:clamp(8px, 0.72vw, 12px); color:var(--muted); padding:0 3px;}

  /* キャンペーン期間の帯 */
  /* キャンペーン：細い線を上にまとめ、その下に開始/終了の名前 */
  .lines{margin:1px -5px 1px; flex:none; display:flex; flex-direction:column; gap:1px;}
  .cline{height:3px; cursor:pointer;}
  .cline.start{border-top-left-radius:2px; border-bottom-left-radius:2px; margin-left:3px;}
  .cline.end{border-top-right-radius:2px; border-bottom-right-radius:2px; margin-right:3px;}
  .cline.empty{background:transparent; pointer-events:none;}
  .cpnames{flex:none; display:flex; flex-direction:column; gap:0; margin-bottom:1px;}
  .cpname{font-size:clamp(8px, 0.72vw, 12px); font-weight:700; line-height:1.0; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:50;}
  .overlay.open{display:flex;}
  .dialog{
    background:var(--panel); color:var(--ink);
    width:min(420px,92vw); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.3);
    padding:20px; max-height:86vh; display:flex; flex-direction:column;
  }
  .dialog h2{margin:0 0 14px; font-size:17px;}
  .ev-list{list-style:none; margin:0 0 14px; padding:0; overflow:auto;}
  .ev-list li{display:flex; align-items:center; gap:8px; background:var(--chip); border-radius:8px; padding:7px 10px; margin-bottom:6px;}
  .ev-list li span{flex:1; font-size:14px; word-break:break-word;}
  .ev-list li button{border:none; background:transparent; color:var(--sun); font-size:18px; cursor:pointer; line-height:1; padding:2px 6px;}
  .ev-list li button.cp-edit{color:var(--accent); font-size:15px;}
  .ev-list li.editing{outline:2px solid var(--accent); outline-offset:-2px;}
  .ev-empty{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .add-row{display:flex; gap:8px;}
  .add-row input{flex:1; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);}
  .add-row input:focus{outline:none; border-color:var(--accent);}
  .add-row select{font:inherit; font-size:14px; padding:9px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);}
  .dialog-foot{display:flex; justify-content:flex-end; margin-top:16px;}
  .recur-head{font-size:12px; font-weight:700; color:var(--recur-ink); margin:0 0 6px;}
  .ev-list li.recur{background:var(--recur);}
  .ev-list li.recur span{color:var(--recur-ink);}
  .sub-head{font-size:12px; font-weight:700; color:var(--muted); margin:0 0 6px;}
  .swatch{width:26px; height:26px; border-radius:50%; flex:none; border:2px solid transparent; cursor:pointer; padding:0;}
  .swatch.sel{border-color:var(--ink);}
  .color-dot{width:14px; height:14px; border-radius:50%; flex:none;}
  .cp-dates{display:flex; gap:10px; margin-bottom:10px;}
  .cp-date{flex:1;}
  .cp-date > span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .ymd{display:flex; gap:4px;}
  .ymd select{flex:1; font:inherit; font-size:14px; padding:7px 3px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);}
  .cp-colors{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}

  #loading{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:100; font-size:15px; color:var(--muted);}

  /* スマホ・狭い画面：2か月を縦に並べ、各月を大きく・文字を少し大きく */
  @media (max-width: 820px){
    html, body{ height:auto; min-height:100%; }
    body{ overflow-y:auto; overflow-x:hidden; }
    header.bar{ flex-wrap:wrap; gap:8px 10px; position:sticky; top:0; }
    .hint{ display:none; }
    main{ flex-direction:column; height:auto; padding:10px; gap:16px; }
    .month{ flex:none; }
    .grid{ grid-auto-rows:minmax(70px, auto); }
    .month-title{ font-size:19px; }
    .num{ font-size:17px; }
    .ev, .more, .cpname, .holi-name{ font-size:12px; }
    .weekdays div{ font-size:12px; }
    .cline{ height:4px; }
  }
</style>
</head>
<body>
  <header class="bar">
    <h1>📅 予定カレンダー</h1>
    <button class="btn" id="prev">◀ 前へ</button>
    <button class="btn" id="todayBtn">今月</button>
    <button class="btn" id="next">次へ ▶</button>
    <button class="btn" id="recurBtn">🔁 くり返す予定</button>
    <button class="btn" id="cpBtn">🎌 キャンペーン期間</button>
    <span class="status" id="status"></span>
    <span class="spacer"></span>
    <span class="hint">日付をクリックして予定を書き込めます（クラウド保存・全端末で共有）</span>
  </header>

  <main>
    <section class="month" id="monthLeft"></section>
    <section class="month" id="monthRight"></section>
  </main>

  <!-- 予定入力ダイアログ -->
  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="dlgTitle">予定</h2>
      <p class="sub-head" id="dlgCpHead" style="display:none;">🎌 この日のキャンペーン</p>
      <ul class="ev-list" id="dlgCp"></ul>
      <p class="recur-head" id="dlgRecurHead" style="display:none;">🔁 くり返す予定</p>
      <ul class="ev-list" id="dlgRecur"></ul>
      <ul class="ev-list" id="dlgList"></ul>
      <p class="ev-empty" id="dlgEmpty">まだ予定はありません。</p>
      <div class="add-row">
        <input type="text" id="dlgInput" placeholder="予定を入力してEnter（例：13時 本部会議）" autocomplete="off">
        <button class="btn primary" id="dlgAdd">追加</button>
      </div>
      <div class="dialog-foot"><button class="btn" id="dlgClose">閉じる</button></div>
    </div>
  </div>

  <!-- 毎月の予定 管理ダイアログ -->
  <div class="overlay" id="recurOverlay">
    <div class="dialog">
      <h2>🔁 くり返す予定</h2>
      <ul class="ev-list" id="recurList"></ul>
      <p class="ev-empty" id="recurEmpty">まだ登録がありません。「○日」と内容を選んで追加してください。</p>
      <div class="add-row" style="margin-bottom:8px;">
        <select id="recurFreq"></select>
        <select id="recurDay"></select>
      </div>
      <div class="add-row">
        <input type="text" id="recurText" placeholder="内容（例：給料日・年金支給日）" autocomplete="off">
        <button class="btn primary" id="recurAdd">追加</button>
      </div>
      <div class="dialog-foot"><button class="btn" id="recurClose">閉じる</button></div>
    </div>
  </div>

  <!-- キャンペーン期間 管理ダイアログ -->
  <div class="overlay" id="cpOverlay">
    <div class="dialog">
      <h2>🎌 キャンペーン期間</h2>
      <ul class="ev-list" id="cpList"></ul>
      <p class="ev-empty" id="cpEmpty">まだ登録がありません。開始日・終了日・内容・色を選んで追加してください。</p>
      <div class="cp-dates">
        <div class="cp-date"><span>開始日</span><div class="ymd" id="cpStart"></div></div>
        <div class="cp-date"><span>終了日</span><div class="ymd" id="cpEnd"></div></div>
      </div>
      <div class="add-row" style="margin-bottom:10px;">
        <input type="text" id="cpText" placeholder="内容（例：夏の感謝祭）" autocomplete="off">
      </div>
      <p class="sub-head" style="margin-bottom:6px;">色</p>
      <div class="cp-colors" id="cpColors"></div>
      <div class="dialog-foot">
        <button class="btn primary" id="cpAdd" style="margin-right:auto;">追加</button>
        <button class="btn" id="cpCancel" style="display:none;">新規に戻す</button>
        <button class="btn" id="cpClose">閉じる</button>
      </div>
    </div>
  </div>

  <div id="loading">読み込み中…</div>

<script>
(function(){
  "use strict";
  var WEEK = ["日","月","火","水","木","金","土"];

  // ---- クラウドの状態 ----
  var events = {};     // { "2026-10-14":[{id,text},...] }
  var recurring = [];  // [{id, day:1..31 または "last", text}]
  var periods = [];    // [{id, start:"y-m-d", end:"y-m-d", text, color}]
  var COLORS = ["#e5534b","#e8833a","#d2a106","#3fa65a","#3f7fd6","#9b5fd0","#d85fa0","#8a949e"];
  var LANE_CAP = 5;    // 画面に表示する帯の最大段数

  var statusEl = document.getElementById("status");
  function setStatus(msg, isErr){
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (isErr ? " err" : "");
  }

  // サーバー呼び出し（成功で最新の全データを受け取り描画）
  function callServer(method, args, after){
    setStatus("保存中…");
    var r = google.script.run
      .withSuccessHandler(function(state){
        events = state.events || {};
        recurring = state.recurring || [];
        periods = state.periods || [];
        setStatus("");
        render();
        if(after) after();
      })
      .withFailureHandler(function(err){
        setStatus("通信エラー（保存できませんでした）", true);
        console.error(err);
      });
    r[method].apply(r, args || []);
  }

  function key(y,m,d){ return y+"-"+(m+1)+"-"+d; }
  function dkey(dt){ return key(dt.getFullYear(), dt.getMonth(), dt.getDate()); }

  // その月の「第nth △曜」の日にち（無ければnull）
  function nthWeekdayDate(y, m, nth, dow){
    var firstDow = new Date(y, m, 1).getDay();
    var day = 1 + ((dow - firstDow + 7) % 7) + (nth-1)*7;
    var last = new Date(y, m+1, 0).getDate();
    return day<=last ? day : null;
  }
  function recurringFor(y,m,d){
    var last = new Date(y, m+1, 0).getDate();
    var monthNo = m+1;
    var out = [];
    recurring.forEach(function(r){
      var day = r.day;
      // 月の偶数/奇数しぼり込み
      if(typeof day==="string"){
        if(day.indexOf("even:")===0){ if(monthNo%2!==0) return; day = day.slice(5); }
        else if(day.indexOf("odd:")===0){ if(monthNo%2!==1) return; day = day.slice(4); }
      }
      if(day==="last"){ if(d===last) out.push(r); }
      else if(typeof day==="string" && day.indexOf("nth:")===0){
        var p = day.split(":");             // ["nth", 第n, 曜日]
        if(nthWeekdayDate(y,m,+p[1],+p[2])===d) out.push(r);
      }
      else if(typeof day==="string" && day.indexOf("dow:")===0){   // 毎週○曜日（週ごと）
        if(new Date(y,m,d).getDay()===(+day.slice(4))) out.push(r);
      }
      else if((+day)===d){ out.push(r); }
    });
    return out;
  }

  // ---- キャンペーン期間の段（lane）計算 ----
  function toNum(s){ var a=String(s).split("-"); return (+a[0])*10000 + (+a[1])*100 + (+a[2]); }
  var laneOf = {};   // id -> 段番号
  var maxLane = -1;  // 使われている最大段
  function computeLanes(){
    laneOf = {}; maxLane = -1;
    var sorted = periods.slice().sort(function(a,b){
      var as=toNum(a.start), bs=toNum(b.start);
      if(as!==bs) return as-bs;
      return toNum(a.end)-toNum(b.end);
    });
    var laneEnd = []; // 段ごとの、最後の期間の終了値
    sorted.forEach(function(p){
      var s=toNum(p.start), e=toNum(p.end);
      var lane=0;
      while(lane<laneEnd.length && laneEnd[lane]>=s) lane++;
      laneEnd[lane]=e;
      laneOf[p.id]=lane;
    });
    maxLane = laneEnd.length - 1;
  }
  function periodsFor(dNum){
    var out = [];
    periods.forEach(function(p){
      if(toNum(p.start)<=dNum && dNum<=toNum(p.end)) out.push(p);
    });
    return out;
  }

  // ---- 祝日の自動計算（現行法） ----
  var holCache = {};
  function springEquinox(y){ return Math.floor(20.8431 + 0.242194*(y-1980) - Math.floor((y-1980)/4)); }
  function autumnEquinox(y){ return Math.floor(23.2488 + 0.242194*(y-1980) - Math.floor((y-1980)/4)); }
  function nthMonday(y, mi, n){
    var firstDow = new Date(y, mi, 1).getDay();
    return 1 + ((1 - firstDow + 7) % 7) + (n-1)*7;
  }
  function getHolidays(year){
    if(holCache[year]) return holCache[year];
    var nat = {}, map = {};
    function add(mi,d,name){ var k=key(year,mi,d); nat[k]=name; map[k]=name; }
    add(0,1,"元日"); add(1,11,"建国記念の日"); add(1,23,"天皇誕生日");
    add(2, springEquinox(year), "春分の日"); add(3,29,"昭和の日");
    add(4,3,"憲法記念日"); add(4,4,"みどりの日"); add(4,5,"こどもの日");
    add(7,11,"山の日"); add(8, autumnEquinox(year), "秋分の日");
    add(10,3,"文化の日"); add(10,23,"勤労感謝の日");
    add(0, nthMonday(year,0,2), "成人の日"); add(6, nthMonday(year,6,3), "海の日");
    add(8, nthMonday(year,8,3), "敬老の日"); add(9, nthMonday(year,9,2), "スポーツの日");
    var end = new Date(year,11,31), dt, p, n;
    for(dt=new Date(year,0,2); dt<end; dt.setDate(dt.getDate()+1)){
      var k0 = dkey(dt);
      if(map[k0] || dt.getDay()===0) continue;
      p = new Date(dt); p.setDate(p.getDate()-1);
      n = new Date(dt); n.setDate(n.getDate()+1);
      if(nat[dkey(p)] && nat[dkey(n)]) map[k0] = "国民の休日";
    }
    for(dt=new Date(year,0,1); dt<=end; dt.setDate(dt.getDate()+1)){
      if(nat[dkey(dt)] && dt.getDay()===0){
        var nx = new Date(dt);
        do { nx.setDate(nx.getDate()+1); } while(map[dkey(nx)]);
        map[dkey(nx)] = "振替休日";
      }
    }
    holCache[year] = map;
    return map;
  }

  // ---- 表示月 ----
  var today = new Date();
  var base = new Date(today.getFullYear(), today.getMonth(), 1);
  function sameDay(y,m,d){ return y===today.getFullYear() && m===today.getMonth() && d===today.getDate(); }

  function buildMonth(el, year, month){
    el.innerHTML = "";
    var title = document.createElement("div");
    title.className = "month-title";
    title.textContent = year + "年 " + (month+1) + "月";
    el.appendChild(title);

    var wd = document.createElement("div");
    wd.className = "weekdays";
    for(var i=0;i<7;i++){
      var w = document.createElement("div");
      w.textContent = WEEK[i];
      if(i===0) w.className="sun";
      if(i===6) w.className="sat";
      wd.appendChild(w);
    }
    el.appendChild(wd);

    var grid = document.createElement("div");
    grid.className = "grid";
    var first = new Date(year, month, 1);
    var start = new Date(year, month, 1 - first.getDay());

    for(var n=0;n<42;n++){
      var dt = new Date(start.getFullYear(), start.getMonth(), start.getDate()+n);
      var y=dt.getFullYear(), m=dt.getMonth(), d=dt.getDate();
      var inMonth = (m===month);
      var holName = getHolidays(y)[key(y,m,d)];

      var cell = document.createElement("div");
      cell.className = "cell";
      if(!inMonth) cell.className += " other";
      if(holName) cell.className += " holiday";
      if(sameDay(y,m,d)) cell.className += " today";

      var dow = dt.getDay();
      var num = document.createElement("div");
      num.className = "num" + (holName?" holiday":dow===0?" sun":dow===6?" sat":"");
      num.textContent = d;
      cell.appendChild(num);

      if(holName){
        var hn = document.createElement("div");
        hn.className = "holi-name";
        hn.textContent = holName; hn.title = holName;
        cell.appendChild(hn);
      }

      // キャンペーン期間：細い線を上にまとめ、その下に開始/終了の名前
      if(maxLane >= 0){
        var dNum = y*10000 + (m+1)*100 + d;
        var covering = periodsFor(dNum);
        if(covering.length){
          var slots = [];
          covering.forEach(function(p){ slots[laneOf[p.id]] = p; });
          var laneCount = Math.min(maxLane+1, LANE_CAP);
          // 上：細い線をまとめる（各段そろえる）
          var lines = document.createElement("div");
          lines.className = "lines";
          for(var L=0; L<laneCount; L++){
            var pp = slots[L];
            var ln = document.createElement("div");
            if(!pp){
              ln.className = "cline empty";
            }else{
              var isS = (dNum===toNum(pp.start));
              var isE = (dNum===toNum(pp.end));
              ln.className = "cline" + (isS?" start":"") + (isE?" end":"");
              ln.style.background = pp.color || "#3f7fd6";
              ln.title = pp.text + "（" + pp.start.replace(/^\d+-/,"").replace("-","/")
                       + "〜" + pp.end.replace(/^\d+-/,"").replace("-","/") + "）";
              ln.addEventListener("click", function(e){ e.stopPropagation(); openCp(); });
            }
            lines.appendChild(ln);
          }
          cell.appendChild(lines);
          // 下：この日に始まる/終わるCPの名前（同じ色）
          var names = document.createElement("div");
          names.className = "cpnames";
          for(var L2=0; L2<laneCount; L2++){
            var p2 = slots[L2];
            if(!p2) continue;
            var s2 = (dNum===toNum(p2.start));
            var e2 = (dNum===toNum(p2.end));
            if(s2 || e2){
              var nm = document.createElement("div");
              nm.className = "cpname";
              nm.textContent = p2.text + ((s2 && e2) ? "" : (s2 ? " 開始" : " 終了"));
              nm.style.color = p2.color || "#3f7fd6";
              names.appendChild(nm);
            }
          }
          if(names.children.length) cell.appendChild(names);
        }
      }

      var k = key(y,m,d);
      var list = events[k] || [];
      var recur = recurringFor(y,m,d);
      var all = recur.map(function(r){return {t:r.text, r:true};})
                     .concat(list.map(function(e){return {t:e.text, r:false};}));
      var box = document.createElement("div");
      box.className = "events";
      var show = Math.min(all.length, 4);
      for(var j=0;j<show;j++){
        var ev = document.createElement("div");
        ev.className = "ev" + (all[j].r ? " recur" : "");
        ev.textContent = all[j].t;
        box.appendChild(ev);
      }
      if(all.length>show){
        var more = document.createElement("div");
        more.className = "more";
        more.textContent = "＋" + (all.length-show) + "件";
        box.appendChild(more);
      }
      cell.appendChild(box);

      (function(yy,mm,dd){
        cell.addEventListener("click", function(){ openDialog(yy,mm,dd); });
      })(y,m,d);

      grid.appendChild(cell);
    }
    el.appendChild(grid);
  }

  function render(){
    computeLanes();
    var ly=base.getFullYear(), lm=base.getMonth();
    var right = new Date(ly, lm+1, 1);
    buildMonth(document.getElementById("monthLeft"), ly, lm);
    buildMonth(document.getElementById("monthRight"), right.getFullYear(), right.getMonth());
  }

  // ---- 予定ダイアログ ----
  var cur = null;
  var overlay = document.getElementById("overlay");
  var dlgTitle = document.getElementById("dlgTitle");
  var dlgList = document.getElementById("dlgList");
  var dlgEmpty = document.getElementById("dlgEmpty");
  var dlgInput = document.getElementById("dlgInput");
  var dlgRecur = document.getElementById("dlgRecur");
  var dlgRecurHead = document.getElementById("dlgRecurHead");
  var dlgCp = document.getElementById("dlgCp");
  var dlgCpHead = document.getElementById("dlgCpHead");

  function openDialog(y,m,d){
    cur = {y:y,m:m,d:d,k:key(y,m,d)};
    var hol = getHolidays(y)[key(y,m,d)];
    dlgTitle.textContent = y+"年"+(m+1)+"月"+d+"日 ("+WEEK[new Date(y,m,d).getDay()]+")"
                           + (hol ? " ・ "+hol : "") + " の予定";
    dlgInput.value = "";
    refreshList();
    overlay.classList.add("open");
    dlgInput.focus();
  }
  function closeDialog(){ overlay.classList.remove("open"); cur=null; }

  function refreshList(){
    // この日のキャンペーン（読み取り専用）
    var dNum = cur.y*10000 + (cur.m+1)*100 + cur.d;
    var cps = periodsFor(dNum);
    dlgCp.innerHTML = "";
    dlgCpHead.style.display = cps.length ? "block" : "none";
    cps.forEach(function(p){
      var li = document.createElement("li");
      var dot = document.createElement("span");
      dot.className = "color-dot"; dot.style.background = p.color || "#3f7fd6";
      var span = document.createElement("span");
      span.textContent = p.text;
      li.appendChild(dot); li.appendChild(span);
      dlgCp.appendChild(li);
    });

    var rec = recurringFor(cur.y, cur.m, cur.d);
    dlgRecur.innerHTML = "";
    dlgRecurHead.style.display = rec.length ? "block" : "none";
    rec.forEach(function(r){
      var li = document.createElement("li");
      li.className = "recur";
      var span = document.createElement("span");
      span.textContent = r.text;
      li.appendChild(span);
      dlgRecur.appendChild(li);
    });

    var list = events[cur.k] || [];
    dlgList.innerHTML = "";
    dlgEmpty.style.display = list.length ? "none" : "block";
    list.forEach(function(e){
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.textContent = e.text;
      var del = document.createElement("button");
      del.textContent = "×"; del.title = "削除";
      del.addEventListener("click", function(){
        callServer("apiDeleteEvent", [e.id], function(){ if(cur) refreshList(); });
      });
      li.appendChild(span); li.appendChild(del);
      dlgList.appendChild(li);
    });
  }

  function addEvent(){
    var t = dlgInput.value.trim();
    if(!t || !cur) return;
    dlgInput.value = "";
    callServer("apiAddEvent", [cur.k, t], function(){
      if(cur) refreshList();
      dlgInput.focus();
    });
  }

  document.getElementById("dlgAdd").addEventListener("click", addEvent);
  dlgInput.addEventListener("keydown", function(e){ if(e.key==="Enter") addEvent(); });
  document.getElementById("dlgClose").addEventListener("click", closeDialog);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeDialog(); });

  // ---- 毎月の予定 管理 ----
  var recurOverlay = document.getElementById("recurOverlay");
  var recurList = document.getElementById("recurList");
  var recurEmpty = document.getElementById("recurEmpty");
  var recurDay = document.getElementById("recurDay");
  var recurFreq = document.getElementById("recurFreq");
  var recurText = document.getElementById("recurText");

  var NTH = ["第1","第2","第3","第4","第5"];
  (function(){
    // 月のひんど：毎月 / 偶数月 / 奇数月
    [["","毎月"],["even","偶数月"],["odd","奇数月"]].forEach(function(f){
      var o=document.createElement("option"); o.value=f[0]; o.textContent=f[1]; recurFreq.appendChild(o);
    });
  })();
  (function(){
    // 日にちで指定
    var g1 = document.createElement("optgroup"); g1.label = "日にちで指定";
    for(var i=1;i<=31;i++){
      var o=document.createElement("option"); o.value=String(i); o.textContent=i+"日";
      g1.appendChild(o);
    }
    var ol=document.createElement("option"); ol.value="last"; ol.textContent="末日";
    g1.appendChild(ol);
    recurDay.appendChild(g1);
    // 曜日で指定（第1〜第5 × 日〜土）
    var g2 = document.createElement("optgroup"); g2.label = "曜日で指定";
    for(var n=1;n<=5;n++){
      for(var w=0;w<7;w++){
        var o2=document.createElement("option");
        o2.value="nth:"+n+":"+w;
        o2.textContent=NTH[n-1]+WEEK[w]+"曜日";
        g2.appendChild(o2);
      }
    }
    recurDay.appendChild(g2);
    // 毎週（曜日）＝週ごとにくり返す
    var g3 = document.createElement("optgroup"); g3.label = "毎週（曜日）";
    for(var w2=0;w2<7;w2++){
      var o3=document.createElement("option");
      o3.value="dow:"+w2;
      o3.textContent="毎週"+WEEK[w2]+"曜日";
      g3.appendChild(o3);
    }
    recurDay.appendChild(g3);
  })();

  function openRecur(){ refreshRecur(); recurOverlay.classList.add("open"); recurText.focus(); }
  function closeRecur(){ recurOverlay.classList.remove("open"); }
  function recurLabel(r){
    var day = r.day, head = "毎月";
    if(typeof day==="string"){
      if(day.indexOf("even:")===0){ head="偶数月"; day=day.slice(5); }
      else if(day.indexOf("odd:")===0){ head="奇数月"; day=day.slice(4); }
    }
    var core;
    if(day==="last") core="末日";
    else if(typeof day==="string" && day.indexOf("nth:")===0){
      var p = day.split(":"); core = NTH[(+p[1])-1] + WEEK[+p[2]] + "曜日";
    }
    else if(typeof day==="string" && day.indexOf("dow:")===0){
      core = "毎週" + WEEK[+day.slice(4)] + "曜日";
      if(head==="毎月") head="";   // 「毎月毎週…」の二重表示を避ける
    }
    else core = (+day)+"日";
    return head + core;
  }

  function refreshRecur(){
    recurList.innerHTML = "";
    recurEmpty.style.display = recurring.length ? "none" : "block";
    recurring.forEach(function(r){
      var li = document.createElement("li");
      var span = document.createElement("span");
      span.textContent = recurLabel(r) + "　" + r.text;
      var del = document.createElement("button");
      del.textContent = "×"; del.title = "削除";
      del.addEventListener("click", function(){
        callServer("apiDeleteRecurring", [r.id], refreshRecur);
      });
      li.appendChild(span); li.appendChild(del);
      recurList.appendChild(li);
    });
  }

  function addRecur(){
    var t = recurText.value.trim();
    if(!t) return;
    var v = recurDay.value;
    var f = recurFreq.value;               // "" / "even" / "odd"
    if(f) v = f + ":" + v;                  // 例: even:15 = 偶数月の15日
    recurText.value = "";
    callServer("apiAddRecurring", [v, t], function(){
      refreshRecur();
      recurText.focus();
    });
  }

  document.getElementById("recurBtn").addEventListener("click", openRecur);
  document.getElementById("recurAdd").addEventListener("click", addRecur);
  recurText.addEventListener("keydown", function(e){ if(e.key==="Enter") addRecur(); });
  document.getElementById("recurClose").addEventListener("click", closeRecur);
  recurOverlay.addEventListener("click", function(e){ if(e.target===recurOverlay) closeRecur(); });

  // ---- キャンペーン期間 管理 ----
  var cpOverlay = document.getElementById("cpOverlay");
  var cpList = document.getElementById("cpList");
  var cpEmpty = document.getElementById("cpEmpty");
  var cpStart = document.getElementById("cpStart");
  var cpEnd = document.getElementById("cpEnd");
  var cpText = document.getElementById("cpText");
  var cpColors = document.getElementById("cpColors");
  var cpAddBtn = document.getElementById("cpAdd");
  var cpCancelBtn = document.getElementById("cpCancel");
  var cpSelColor = COLORS[4]; // 既定は青
  var cpEditId = null;        // 編集中のキャンペーンid（null＝新規追加）

  function pad2(n){ return (n<10?"0":"")+n; }
  function toInput(dt){ return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate()); }
  function fromInput(v){ var a=v.split("-"); return (+a[0])+"-"+(+a[1])+"-"+(+a[2]); } // "2026-10-05"→"2026-10-5"
  function mdLabel(s){ var a=String(s).split("-"); return a[1]+"/"+a[2]; }

  // 色の選択ボタンを作る
  (function(){
    COLORS.forEach(function(c){
      var b=document.createElement("button");
      b.className="swatch" + (c===cpSelColor?" sel":"");
      b.style.background=c;
      b.setAttribute("data-color", c);
      b.addEventListener("click", function(){ setCpColor(c); });
      cpColors.appendChild(b);
    });
  })();
  // 色を選ぶ（クリックでも、編集の読み込みでも使う）
  function setCpColor(c){
    cpSelColor = c;
    Array.prototype.forEach.call(cpColors.children, function(el){
      el.classList.toggle("sel", el.getAttribute("data-color")===c);
    });
  }

  // 年・月・日 のプルダウンを作る（矢印なし）
  function buildYmd(container){
    var ySel=document.createElement("select");
    var mSel=document.createElement("select");
    var dSel=document.createElement("select");
    var ty=today.getFullYear();
    for(var y=ty-1; y<=ty+2; y++){ var o=document.createElement("option"); o.value=y; o.textContent=y+"年"; ySel.appendChild(o); }
    for(var mo=1; mo<=12; mo++){ var o2=document.createElement("option"); o2.value=mo; o2.textContent=mo+"月"; mSel.appendChild(o2); }
    for(var da=1; da<=31; da++){ var o3=document.createElement("option"); o3.value=da; o3.textContent=da+"日"; dSel.appendChild(o3); }
    container.appendChild(ySel); container.appendChild(mSel); container.appendChild(dSel);
    return {y:ySel, m:mSel, d:dSel};
  }
  var ymdStart = buildYmd(cpStart);
  var ymdEnd = buildYmd(cpEnd);
  function ymdSet(ymd, dt){ ymd.y.value=dt.getFullYear(); ymd.m.value=dt.getMonth()+1; ymd.d.value=dt.getDate(); }
  function ymdSetStr(ymd, s){ var a=String(s).split("-"); ymd.y.value=+a[0]; ymd.m.value=+a[1]; ymd.d.value=+a[2]; }
  function ymdGet(ymd){
    var y=+ymd.y.value, m=+ymd.m.value, d=+ymd.d.value;
    var last=new Date(y, m, 0).getDate();   // m月の最終日
    if(d>last) d=last;                        // 無い日(2/31等)は末日に丸める
    return y+"-"+m+"-"+d;                     // 保存形式（非パディング）
  }

  function openCp(){
    cancelEditCp();          // 新規追加モードで開く
    refreshCp();
    cpOverlay.classList.add("open");
  }
  function closeCp(){ cpOverlay.classList.remove("open"); }

  // 編集をやめて「新規追加」モードに戻す
  function cancelEditCp(){
    cpEditId = null;
    cpText.value = "";
    ymdSet(ymdStart, today);
    ymdSet(ymdEnd, today);
    setCpColor(COLORS[4]);
    cpAddBtn.textContent = "追加";
    cpCancelBtn.style.display = "none";
  }

  // 一覧で選んだキャンペーンをフォームに読み込む（編集モード）
  function startEditCp(p){
    cpEditId = p.id;
    ymdSetStr(ymdStart, p.start);
    ymdSetStr(ymdEnd, p.end);
    cpText.value = p.text;
    setCpColor(p.color || COLORS[4]);
    cpAddBtn.textContent = "更新";
    cpCancelBtn.style.display = "";
    cpText.focus();
  }

  function refreshCp(){
    cpList.innerHTML = "";
    var sorted = periods.slice().sort(function(a,b){ return toNum(a.start)-toNum(b.start); });
    cpEmpty.style.display = sorted.length ? "none" : "block";
    sorted.forEach(function(p){
      var li = document.createElement("li");
      if(p.id===cpEditId) li.classList.add("editing");
      var dot = document.createElement("span");
      dot.className = "color-dot"; dot.style.background = p.color || "#3f7fd6";
      var span = document.createElement("span");
      span.textContent = mdLabel(p.start) + "〜" + mdLabel(p.end) + "　" + p.text;
      var edit = document.createElement("button");
      edit.textContent = "✏"; edit.title = "変更"; edit.className = "cp-edit";
      edit.addEventListener("click", function(){ startEditCp(p); });
      var del = document.createElement("button");
      del.textContent = "×"; del.title = "削除";
      del.addEventListener("click", function(){
        if(p.id===cpEditId) cancelEditCp();
        callServer("apiDeletePeriod", [p.id], refreshCp);
      });
      li.appendChild(dot); li.appendChild(span); li.appendChild(edit); li.appendChild(del);
      cpList.appendChild(li);
    });
  }

  function addCp(){
    var t = cpText.value.trim();
    if(!t){ cpText.focus(); return; }
    var s = ymdGet(ymdStart), e = ymdGet(ymdEnd);
    if(toNum(e) < toNum(s)){ var tmp=s; s=e; e=tmp; } // 逆なら入れ替え
    if(cpEditId){
      // 選んだキャンペーンを上書き更新
      callServer("apiUpdatePeriod", [cpEditId, s, e, t, cpSelColor], function(){
        cancelEditCp(); refreshCp();
      });
    }else{
      cpText.value = "";
      callServer("apiAddPeriod", [s, e, t, cpSelColor], refreshCp);
    }
  }

  document.getElementById("cpBtn").addEventListener("click", openCp);
  document.getElementById("cpAdd").addEventListener("click", addCp);
  cpCancelBtn.addEventListener("click", cancelEditCp);
  cpText.addEventListener("keydown", function(e){ if(e.key==="Enter") addCp(); });
  document.getElementById("cpClose").addEventListener("click", closeCp);
  cpOverlay.addEventListener("click", function(e){ if(e.target===cpOverlay) closeCp(); });

  // ---- ナビ ----
  document.getElementById("prev").addEventListener("click", function(){
    base = new Date(base.getFullYear(), base.getMonth()-1, 1); render();
  });
  document.getElementById("next").addEventListener("click", function(){
    base = new Date(base.getFullYear(), base.getMonth()+1, 1); render();
  });
  document.getElementById("todayBtn").addEventListener("click", function(){
    base = new Date(today.getFullYear(), today.getMonth(), 1); render();
  });

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ closeDialog(); closeRecur(); closeCp(); }
  });

  // ---- 起動：クラウドから読み込み ----
  render();
  google.script.run
    .withSuccessHandler(function(state){
      events = state.events || {};
      recurring = state.recurring || [];
      periods = state.periods || [];
      document.getElementById("loading").style.display = "none";
      render();
    })
    .withFailureHandler(function(err){
      document.getElementById("loading").textContent = "読み込みに失敗しました。再読み込みしてください。";
      console.error(err);
    })
    .apiGetAll();

  // ---- 自動更新（開きっぱなしでも最新に保つ：壁紙表示向け） ----
  // ・日付が変わったら「今日」を更新。当月を表示中なら自動で今月へ送る（月替わりで翌月に進む）
  // ・他の端末で追加した予定も定期的に取り込む
  function autoRefresh(){
    var now = new Date();
    var dayChanged = (now.getFullYear()!==today.getFullYear()
                   || now.getMonth()!==today.getMonth()
                   || now.getDate()!==today.getDate());
    if(dayChanged){
      var wasCurrent = (base.getFullYear()===today.getFullYear()
                     && base.getMonth()===today.getMonth());
      today = now;                                  // 「今日」を今日に更新
      if(wasCurrent){                               // 今月を見ていたら自動で今月へ
        base = new Date(today.getFullYear(), today.getMonth(), 1);
      }
    }
    // ダイアログを開いて操作中は、画面がちらつかないよう取り込みを見送る
    var busy = overlay.classList.contains("open")
            || recurOverlay.classList.contains("open")
            || cpOverlay.classList.contains("open");
    if(busy){ if(dayChanged) render(); return; }
    google.script.run
      .withSuccessHandler(function(state){
        events = state.events || {};
        recurring = state.recurring || [];
        periods = state.periods || [];
        render();
      })
      .withFailureHandler(function(err){ console.error(err); })
      .apiGetAll();
  }
  setInterval(autoRefresh, 15*60*1000);   // 15分ごと
})();
</script>
</body>
</html>
